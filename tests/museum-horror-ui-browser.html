<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Museum horror UI checks</title>
  <link rel="stylesheet" href="../css/museum-horror.css?v=obfuscated-20260926">
  <style>
    body { margin:24px; background:#15131a; color:#ccc; font:16px/1.6 system-ui; }
    #results { position:relative; z-index:15; white-space:pre-wrap; }
    #fixtures { width:480px; max-width:100%; }
    button,input,textarea,select { margin:8px; font:inherit; }
    button { cursor:pointer; } button:focus-visible { outline:2px solid white; }
    .museum-horror-copy { font:inherit; }
  </style>
</head>
<body>
<button id="run">Run UI checks</button>
<button id="preview">Preview corruption</button>
<button id="restore">Restore preview</button>
<pre id="results" role="status">Ready</pre>
<div id="fixtures"></div>
<script type="module">
import { createMuseumHorrorUI } from '../js/museum-horror-ui.js?v=obfuscated-20260926';
const fixtures = document.getElementById('fixtures');
const results = document.getElementById('results');
const assert = (condition, message) => { if (!condition) throw Error(message); };
const checks = [];
const sharedArt = document.createElement('canvas');
sharedArt.width = sharedArt.height = 32;
const sharedContext = sharedArt.getContext('2d');
sharedContext.fillStyle = '#a10000';
sharedContext.fillRect(0, 0, 32, 32);
let previewUI = null;
let previewFrame = 0;
function restorePreview() {
  cancelAnimationFrame(previewFrame);
  previewUI?.dispose();
  previewUI = null;
}
document.getElementById('preview').addEventListener('click', () => {
  restorePreview();
  previewUI = createMuseumHorrorUI({ root: fixtures, artCanvas: sharedArt });
  previewUI.enable();
  let previous = performance.now();
  function animate(now) {
    previewUI.update((now - previous) / 1000);
    previous = now;
    previewFrame = requestAnimationFrame(animate);
  }
  previewFrame = requestAnimationFrame(animate);
});
document.getElementById('restore').addEventListener('click', restorePreview);
function pass(message) { checks.push(`PASS ${message}`); }
document.getElementById('run').addEventListener('click', async () => {
  restorePreview();
  checks.length = 0;
  let ui;
  try {
    fixtures.innerHTML = '<h2>图画展览会 — This is Eytle</h2><button id="control" aria-label="Resume visit">继续参观 Resume visit</button><p id="status">Waiting for gallery</p><label for="name">名字</label><input id="name" placeholder="输入名字" value="My original name"><textarea placeholder="输入评论">Original draft</textarea><select><option>Unlimited</option><option value="60">60 FPS</option></select><div id="mount"></div>';
    const before = fixtures.innerHTML;
    const content = fixtures.textContent;
    const control = fixtures.querySelector('#control');
    const originalTextNode = control.firstChild;
    const input = fixtures.querySelector('input');
    const textarea = fixtures.querySelector('textarea');
    const option = fixtures.querySelector('option');
    let clicks = 0;
    control.addEventListener('click', () => clicks++);
    ui = createMuseumHorrorUI({ root: fixtures, artCanvas: sharedArt });
    ui.update(1);
    assert(fixtures.innerHTML === before, 'Inactive controller touched the page');
    pass('normal visit remains entirely unchanged');
    ui.enable();
    await document.fonts.load('16px MuseumObfuscated');
    assert(document.fonts.check('16px MuseumObfuscated'), 'Pixel face did not load');
    pass('original local pixel font loads for native control labels');
    assert(document.body.classList.contains('museum-horror'), 'Missing opt-in class');
    assert(fixtures.textContent === content, 'Original DOM text was changed');
    assert(originalTextNode.isConnected && originalTextNode.data === '继续参观 Resume visit', 'Original text identity lost');
    assert(control.querySelector('.museum-horror-visual').getAttribute('aria-hidden') === 'true', 'Corruption leaks into accessible text');
    assert(control.getAttribute('aria-label') === 'Resume visit', 'Accessible button name lost');
    control.click();
    assert(clicks === 1, 'Control event listener was lost');
    pass('visual glyphs preserve real text, accessible names and button actions');
    const glyph = control.querySelector('.museum-horror-visual');
    assert(glyph.tagName === 'CANVAS', 'Visual glyphs are still a platform text font');
    const shape = [control.offsetWidth, control.offsetHeight, glyph.width, glyph.height];
    const first = glyph.getAttribute('data-glyphs');
    ui.update(0.02);
    assert(glyph.getAttribute('data-glyphs') === first, 'Corruption updated faster than its cap');
    ui.update(0.022);
    assert(glyph.getAttribute('data-glyphs') !== first, 'Corruption did not animate');
    assert(shape.join() === [control.offsetWidth, control.offsetHeight, glyph.width, glyph.height].join(), 'Characters shifted their fixed cells');
    let updates = 0;
    for (let frame = 0; frame < 120; frame++) {
      const previousGlyphs = glyph.getAttribute('data-glyphs');
      ui.update(1 / 60);
      updates += Number(glyph.getAttribute('data-glyphs') !== previousGlyphs);
    }
    assert(updates === 48, `Expected 48 redraws in two seconds; received ${updates}`);
    pass('pixel glyphs remain in fixed character cells and update at twenty-four per second');
    assert(input.value === 'My original name' && textarea.value === 'Original draft', 'Draft changed');
    assert(option.value === 'Unlimited' && option.textContent === 'Unlimited', 'Implicit select value changed');
    assert(option.label !== 'Unlimited' && option.getAttribute('aria-label') === 'Unlimited', 'Option display/accessibility not separated');
    assert(input.placeholder !== '输入名字' && input.getAttribute('aria-placeholder') === '输入名字', 'Placeholder did not preserve accessible content');
    pass('native control labels change while values and drafts remain intact');
    const status = fixtures.querySelector('#status');
    status.textContent = 'Latest server status';
    const late = document.createElement('section');
    late.innerHTML = '<button>评论 Comments</button><p>New visitor text</p><div class="guestbook-art-frame"><img class="guestbook-art" alt="" src="../images/gallery-preview/0x0000.webp"></div>';
    fixtures.querySelector('#mount').append(late);
    ui.update(0.13);
    assert(status.textContent === 'Latest server status' && status.querySelector('.museum-horror-copy'), 'Updated application text not covered');
    assert(late.querySelectorAll('.museum-horror-copy').length === 2, 'New guestbook text not covered');
    pass('dynamically rebuilt status and guestbook content receive the effect');
    const artImage = late.querySelector('img');
    const artOverlay = late.querySelector('.museum-horror-art');
    const originalSource = artImage.getAttribute('src');
    assert(artOverlay && artOverlay.getAttribute('aria-hidden') === 'true', 'Guestbook artwork overlay missing');
    const pixel = artOverlay.getContext('2d').getImageData(0, 0, 1, 1).data;
    assert(pixel[0] === 161 && pixel[1] === 0 && pixel[2] === 0, 'Guestbook does not show shared animated art');
    sharedContext.fillStyle = '#470000';
    sharedContext.fillRect(0, 0, 32, 32);
    ui.update(0.13);
    assert(artOverlay.getContext('2d').getImageData(0, 0, 1, 1).data[0] === 71, 'Guestbook art does not refresh');
    pass('guestbook images display the shared animation without changing their sources');
    late.remove();
    ui.update(0.13);
    assert(!late.querySelector('.museum-horror-copy'), 'Detached guestbook retained presentation wrappers');
    assert(!late.querySelector('canvas') && !artImage.classList.contains('museum-horror-art-covered'), 'Detached image overlay retained state');
    assert(artImage.getAttribute('src') === originalSource, 'Original image source changed');
    assert(late.textContent === '评论 CommentsNew visitor text', 'Detached source text was lost');
    pass('unmounted guestbook nodes release presentation state');
    input.placeholder = 'Latest placeholder';
    ui.update(0.13);
    ui.dispose();
    assert(!document.body.classList.contains('museum-horror'), 'Body class leaked');
    assert(!fixtures.querySelector('.museum-horror-copy'), 'Wrapper leaked');
    assert(status.textContent === 'Latest server status', 'Disposal restored stale status');
    assert(input.placeholder === 'Latest placeholder', 'Disposal restored stale placeholder');
    assert(!input.hasAttribute('aria-placeholder') && !option.hasAttribute('aria-label') && !option.hasAttribute('label'), 'Temporary native labels leaked');
    assert(option.value === 'Unlimited' && input.value === 'My original name', 'Disposal changed control values');
    pass('disposal restores presentation and keeps the latest real application text');
    ui = createMuseumHorrorUI({ root: fixtures, reducedMotion: true });
    ui.enable();
    const slowGlyph = control.querySelector('.museum-horror-visual');
    const slowFirst = slowGlyph.getAttribute('data-glyphs');
    ui.update(0.25);
    assert(slowGlyph.getAttribute('data-glyphs') === slowFirst, 'Reduced-motion effect changed too quickly');
    ui.update(0.25);
    assert(slowGlyph.getAttribute('data-glyphs') !== slowFirst, 'Reduced-motion update did not run');
    ui.dispose();
    pass('reduced-motion preference lowers updates to twice per second');
    results.textContent = `${checks.join('\n')}\n\n${checks.length} checks passed`;
  } catch (error) {
    ui?.dispose();
    results.textContent = `${checks.join('\n')}\nFAIL ${error.stack}`;
  }
});
</script>
</body>
</html>
