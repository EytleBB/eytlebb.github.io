<!doctype html><meta charset="utf-8"><title>Museum horror audio QA</title>
<button id="run">Render and check actual music</button><pre id="result">Ready</pre>
<script type="module">
import {createMuseumHorrorAudio, MUSEUM_HORROR_PLAYBACK_RATE} from '../js/museum-horror-audio.js';
const result = document.querySelector('#result');
function metrics(buffer) {
  let sum = 0, peak = 0, finite = true;
  for (let c = 0; c < buffer.numberOfChannels; c++) for (const value of buffer.getChannelData(c)) {
    sum += value * value; peak = Math.max(peak, Math.abs(value)); finite &&= Number.isFinite(value);
  }
  return {rms: Math.sqrt(sum / buffer.length / buffer.numberOfChannels), peak, finite};
}
document.querySelector('#run').onclick = async () => {
  result.textContent = 'Rendering…';
  try {
    const bytes = await (await fetch('../audio/museum.mp3')).arrayBuffer();
    const decoder = new OfflineAudioContext(2, 1, 44100), music = await decoder.decodeAudioData(bytes);
    async function render(horror, fallback = false) {
      const context = new OfflineAudioContext(2, 44100 * 12, 44100), source = context.createBufferSource();
      source.buffer = music; source.playbackRate.value = horror ? MUSEUM_HORROR_PLAYBACK_RATE : 1;
      const effectContext = fallback ? Object.fromEntries(['createGain', 'createWaveShaper', 'createBiquadFilter', 'createDelay', 'createOscillator'].map(key => [key, context[key].bind(context)])) : context;
      const audio = createMuseumHorrorAudio({context: effectContext});
      const output = horror ? await audio.enable(source) : source;
      output.connect(context.destination); source.start(0, 12);
      const buffer = await context.startRendering(); audio.dispose();
      return metrics(buffer);
    }
    const normal = await render(false), horror = await render(true), fallback = await render(true, true);
    const louder = horror.rms > normal.rms * 1.15 && fallback.rms > normal.rms * 1.15;
    const bounded = horror.finite && horror.peak < .93 && fallback.finite && fallback.peak < .93;
    result.textContent = JSON.stringify({status: louder && bounded ? 'PASS' : 'FAIL', normal, horror, fallback, louder, bounded, worklet: Boolean(decoder.audioWorklet)}, null, 2);
  } catch (error) { result.textContent = `FAIL: ${error.stack}`; }
};
</script>
