# Only known page routes resolve to HTML; missing assets and private paths keep 404.
location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
}
location ~ ^/(projects|tools|patchlog|gallery|downloads)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
}
location = /museum {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /museum.html =404;
}
location = /museum-admin {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    try_files /museum-admin.html =404;
}
location = /mc-calc {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /mc-calc.html =404;
}
location = /index.html { return 301 /$is_args$args; }
location = /museum.html { return 301 /museum$is_args$args; }
location = /museum-admin.html { return 301 /museum-admin$is_args$args; }
location = /mc-calc.html { return 301 /mc-calc$is_args$args; }
location ~ ^/(projects|tools|patchlog|gallery|downloads|museum|museum-admin|mc-calc)/$ {
    return 301 /$1$is_args$args;
}
